[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "g1-supermimic"
version = "0.1.0"
description = "Unitree G1 model-based control with differentiable dynamics in mjlab"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
  "mjlab==1.6.0",
  "warp-lang==1.18.0",
  "torch==2.7.0",
  "torchvision==0.22.0",
  "matplotlib",
  "mediapy",
  "pillow",
  "tensorboard",
  "imageio",
  "scipy",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
g1-train = "g1_supermimic.train:main"
g1-eval = "g1_supermimic.eval:main"
g1-convert-motion = "g1_supermimic.convert_motion:main"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"scripts/play_isaaclab.py" = ["E402"]

[tool.setuptools.packages.find]
include = ["g1_supermimic*"]

[tool.uv.sources]
warp-lang = { url = "https://github.com/NVIDIA/warp/releases/download/v1.18.0/warp_lang-1.18.0%2Bcu12-py3-none-manylinux_2_28_x86_64.whl", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" }
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
